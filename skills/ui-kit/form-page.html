<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>등록 · 수정 자리 · 서비스 이름 자리</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- app-shell 뼈대 안의 등록 · 수정 폼형. .page 안 내용만 바꾸고 .app 구조는 그대로 둔다. -->
<div class="app">

<nav class="app-nav" aria-label="메뉴">
  <div class="app-brand">서비스 이름 자리</div>
  <ul class="app-menu">
    <!-- 자리: 메뉴 항목 반복 (지금 화면에 aria-current="page") -->
    <li><a href="#">메뉴 A 자리</a></li>
    <li><a href="#">메뉴 B 자리</a></li>
    <li><a href="#" aria-current="page">메뉴 C 자리</a></li>
    <li><a href="#">메뉴 D 자리</a></li>
  </ul>
</nav>

<div class="app-main">
  <header class="app-bar">
    <!-- 선택: SPEC에 없으면 지울 것 (현재 위치) -->
    <span class="sub">서비스 이름 자리 · 메뉴 C 자리</span>
    <div class="role-bar">
      <!-- 선택: SPEC에 없으면 지울 것 (역할 전환; 역할이 하나면 .seg를 지운다) -->
      <span class="hint">역할</span>
      <div class="seg" role="group" aria-label="역할 전환"><button type="button" aria-pressed="true">역할 A</button><button type="button" aria-pressed="false">역할 B</button></div>
      <span class="role-user">사용자 이름 자리</span>
      <a href="login.html">로그아웃</a>
    </div>
  </header>

  <main class="page">
    <header class="topbar">
      <div>
        <h1 class="page-title">등록 · 수정 제목 자리</h1>
        <span class="sub">* 표시는 필수 항목입니다</span>
      </div>
    </header>

    <!-- 상태: 저장 실패일 때만 (서버 오류 · 검증 실패 요약) -->
    <div class="state is-error">
      <span class="badge is-crit">! ERROR 오류</span>
      <span class="state-title">저장하지 못했습니다</span>
      <span class="state-sub">오류 내용 자리 — 표시된 칸을 고친 뒤 다시 저장하세요.</span>
    </div>

    <form class="card" method="post" action="#">
      <div class="form-grid">
        <!-- 자리: 입력 칸 반복 (짧은 칸은 한 칸, 긴 칸은 .span-2) -->
        <label class="field"><span class="field-label">이름 *</span><input type="text" placeholder="이름 자리" required></label>
        <label class="field"><span class="field-label">구분 *</span><span class="select"><select required><option>선택지 A</option><option>선택지 B</option><option>선택지 C</option></select></span></label>
        <label class="field"><span class="field-label">날짜</span><input type="date"></label>
        <label class="field"><span class="field-label">수량</span><input type="number" min="0" placeholder="0"></label>
        <!-- 상태: 칸 오류는 .field에 .is-error + .field-error 한 줄 -->
        <label class="field is-error"><span class="field-label">담당 *</span><input type="text" value="" aria-invalid="true" aria-describedby="e-owner"><span class="field-error" id="e-owner">담당을 입력하세요</span></label>
        <label class="field"><span class="field-label">연락처</span><input type="text" placeholder="자리 채움 문구"></label>
        <label class="field span-2"><span class="field-label">메모 <span class="num">0 / 500</span></span><textarea rows="5" placeholder="메모 자리"></textarea></label>
      </div>
      <div class="form-actions">
        <span class="hint">마지막 저장 <span class="num">2026.10.30 07:00</span></span>
        <div class="row"><button class="btn btn-outline" type="button">취소</button><button class="btn btn-primary" type="submit">저장</button></div>
      </div>
    </form>
  </main>
</div>

</div>
</body>
</html>
